plugins {
    id 'com.android.application'
}

// Major.minor yahaan manually badlaunu (jastai 1.1 ya 2.0).
// Patch number chai har GitHub build sanga automatic badhchha.
def baseVersion = "1.0"
def buildNo = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace 'com.tinku.glasslauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tinku.glasslauncher"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "${baseVersion}.${buildNo}"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
}
