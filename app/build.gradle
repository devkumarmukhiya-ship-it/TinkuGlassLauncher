plugins {
    id 'com.android.application'
}

// Version = build number anusar automatic:
// build 45 -> 1.45, build 99 -> 1.99, build 100 -> 2.0, build 199 -> 2.99, build 200 -> 3.0
def buildNo = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
def verMajor = buildNo.intdiv(100) + 1
def verMinor = buildNo % 100

android {
    namespace 'com.tinku.glasslauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tinku.glasslauncher"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "${verMajor}.${verMinor}"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
}
